name: News Article Classification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: List files for debug
      run: ls -R

    - name: Run basic Streamlit check
      run: |
        streamlit run main.py --server.headless true &
        sleep 10
        pkill streamlit

    - name: Test TensorFlow and Gensim Imports
      run: |
        python -c "import tensorflow as tf; import gensim; print('TensorFlow:', tf.__version__); print('Gensim:', gensim.__version__)"
